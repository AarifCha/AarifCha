<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Keel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b2230"/></linearGradient>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.h{font-weight:700;fill:#e6edf3}
.m{fill:#8b949e}
.d{fill:#6e7681}

.n{animation:glow 7s infinite;opacity:.55}
.n0{animation-delay:-0.3s}.n1{animation-delay:0.75s}.n2{animation-delay:1.8s}
@keyframes glow{0%{opacity:.55}4%{opacity:1}17%{opacity:1}23%{opacity:.55}100%{opacity:.55}}
.ok{opacity:0;animation:ok 7s infinite}@keyframes ok{0%,27%{opacity:0}30%,50%{opacity:1}56%,100%{opacity:0}}
.sh{animation:sh 3s infinite}@keyframes sh{0%,60%{opacity:.35}70%,92%{opacity:1}100%{opacity:.35}}

</style>
</defs>
<rect width="1200" height="220" rx="16" fill="url(#bg)"/>
<g transform="translate(50,46) scale(0.25)"><rect x="18" y="18" width="448" height="448" rx="64" fill="#ffffff"/><path d="M222,95 L222,218 L140,218 Z" fill="#93bcb7"/><path d="M247,63 L247,218 L353,218 Z" fill="#0f6b5f"/><path d="M62,308 C122,296 182,320 242,308 S362,296 422,308" fill="none" stroke="#9fc4bf" stroke-width="7" stroke-linecap="round"/><path d="M218,286 L264,286 L252,370 L236,370 Z" fill="#7baea7"/><ellipse cx="244" cy="382" rx="38" ry="11" fill="#7baea7"/><path d="M76,238 L390,238 L358,286 L108,286 Z" fill="#0f6b5f"/></g>
<text class="h" x="180" y="86" font-size="34">Keel</text>
<text class="m" x="181" y="114" font-size="15">AI agents that</text>
<text class="m" x="181" y="134" font-size="15">stay on course</text>
<path d="M470,100 L930,100 C1020,100 1020,175 930,175 L470,175 C380,175 380,100 470,100" fill="none" stroke="#30363d" stroke-width="3"/>
<circle r="7" fill="#58d1c9"><animateMotion dur="7s" repeatCount="indefinite" path="M470,100 L930,100 C1020,100 1020,175 930,175 L470,175 C380,175 380,100 470,100"/></circle>
<rect x="400" y="74" width="140" height="52" rx="10" fill="#0d1117"/>
<g class="n n0"><rect x="400" y="74" width="140" height="52" rx="10" fill="#0d1117" stroke="#58d1c9" stroke-width="2"/><text x="470" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">Plan</text></g>
<rect x="630" y="74" width="140" height="52" rx="10" fill="#0d1117"/>
<g class="n n1"><rect x="630" y="74" width="140" height="52" rx="10" fill="#0d1117" stroke="#58d1c9" stroke-width="2"/><text x="700" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">Build</text></g>
<rect x="860" y="74" width="140" height="52" rx="10" fill="#0d1117"/>
<g class="n n2"><rect x="860" y="74" width="140" height="52" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><text x="930" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">Verify</text></g>
<path class="ok" d="M978,60 l7,7 l14,-15" fill="none" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1110,78 l26,10 v18 c0,18 -12,28 -26,34 c-14,-6 -26,-16 -26,-34 v-18 z" fill="#0d1117" stroke="#58d1c9" stroke-width="2"/>
<path class="sh" d="M1101,110 l6,6 l12,-13" fill="none" stroke="#58d1c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1110" y="162" text-anchor="middle" font-size="13">guardrails on</text>
<text class="m" x="1110" y="178" text-anchor="middle" font-size="13">every step</text>
</svg>